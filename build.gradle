plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'org.jetbrains.kotlin.jvm'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users in 26.3
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
kotlin {
    jvmToolchain(25)
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
            // ZGC instead of G1: Distant Horizons stutters on G1's pauses. Generational by default on Java 25
            jvmArgument '-XX:+UseZGC'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    // Mods we play alongside in the dev runs, from Modrinth's maven
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

// Which companion mods the dev runs load. Guildmark Settings > Companions in game writes the choice to
// run/config/guildmark/dev-runs.properties, read here the next time the game starts from Gradle;
// -Pwith_<name>=true|false on the command line wins over it, and gradle.properties gives the defaults.
def devRuns = new Properties()
def devRunsText = providers.fileContents(layout.projectDirectory.file("run/config/guildmark/dev-runs.properties")).asText.getOrNull()
if (devRunsText != null) devRuns.load(new StringReader(devRunsText))
def companion = { String name ->
    def chosen = gradle.startParameter.projectProperties["with_" + name] ?: devRuns.getProperty(name) ?: project.findProperty("with_" + name)
    chosen == null || chosen.toString().trim() != "false"
}
// The Companions page shows what the next run loads: for a companion never switched there, that's gradle.properties' say
def projectDefaults = new Properties()
projectDefaults.load(new StringReader(providers.fileContents(layout.projectDirectory.file("gradle.properties")).asText.get()))
neoForge.runs.configureEach {
    for (name in ["tectonic", "distant_horizons", "sodium", "iris"]) {
        systemProperty "guildmark.devRuns." + name, (projectDefaults.getProperty("with_" + name) ?: "true").trim()
    }
}

// Tales (tales/Tales.kt): -Pwith_tales=true turns the story chains on in a dev run before the lead flips Tales.SHIPPED.
// A shipped jar never sets the property, so it plays as SHIPPED says
neoForge.runs.configureEach {
    systemProperty 'guildmark.tales', String.valueOf(project.findProperty('with_tales') ?: 'false')
}

// A companion jar from Modrinth fetched the plain Java way, for jars with a "+" in their name (Sodium's, Iris's).
// Modrinth's maven redirects to its CDN with the "+" escaped as %2B, Gradle's HTTP client unescapes it when it
// follows, and the CDN at times answers 404 for the bare "+" while serving the escaped name fine (2026-10-15:
// "Could not find iris-Ag5S66CF.jar"). Java's own client keeps the escape. Each version is fetched once into
// .gradle/companions; if the fetch fails, the run goes without that companion rather than not at all.
def modrinthJar = { String slug, String version ->
    def jar = layout.projectDirectory.file(".gradle/companions/${slug}-${version}.jar").asFile
    if (!jar.exists()) {
        def part = new File(jar.path + ".part")
        try {
            jar.parentFile.mkdirs()
            def connection = new URI("https://api.modrinth.com/maven/maven/modrinth/${slug}/${version}/${slug}-${version}.jar").toURL().openConnection()
            connection.connectTimeout = 15000
            connection.readTimeout = 60000
            connection.inputStream.withStream { input -> part.withOutputStream { it << input } }
            java.nio.file.Files.move(part.toPath(), jar.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        } catch (Exception e) {
            part.delete()
            logger.warn("Guildmark dev runs: couldn't fetch ${slug} ${version} from Modrinth, so this run goes without it: ${e}")
            return files()
        }
    }
    files(jar)
}

// Iris draws through OpenGL alone and crashes on Minecraft's Vulkan backend, so with it loaded the client run
// asks for OpenGL, whatever the video settings say
if (companion("sodium") && companion("iris")) {
    neoForge.runs.named("client") {
        programArguments.addAll '--graphicsBackend', 'opengl'
    }
}

dependencies {
    // Tectonic's grander terrain in the dev runs only (never shipped; players add it themselves)
    if (companion("tectonic")) {
        localRuntime "maven.modrinth:tectonic:${tectonic_version}"
        localRuntime "maven.modrinth:lithostitched:${lithostitched_version}"
    }

    // Distant Horizons' far view in the dev runs only, the same way, with the SeedGen add-on, which draws
    // the far land from the seed instead. SeedGen's own switch (also under Companions) decides whether it does.
    if (companion("distant_horizons")) {
        localRuntime "maven.modrinth:distanthorizons:${distant_horizons_version}"
        if (companion("seedgen")) {
            localRuntime "maven.modrinth:distant-horizons-seedgen:${seedgen_version}"
        }
    }

    // Sodium's faster renderer in the dev runs only, so Guildmark is played and tested with it. Never
    // required or shipped: players who want it add it themselves.
    if (companion("sodium")) {
        localRuntime modrinthJar("sodium", sodium_version)

        // Iris on top of it, which needs it, so Guildmark's own shader pack is played and tested in the dev runs
        // too. Never required or shipped either.
        if (companion("iris")) {
            localRuntime modrinthJar("iris", iris_version)
        }
    }

    // Kotlin runs without Kotlin for Forge: the stdlib ships inside our jar.
    // Jar-in-Jar picks one copy if several mods bundle it.
    jarJar(implementation("org.jetbrains.kotlin:kotlin-stdlib")) {
        version {
            strictly "[2.0,)"
            prefer kotlin_version
        }
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
