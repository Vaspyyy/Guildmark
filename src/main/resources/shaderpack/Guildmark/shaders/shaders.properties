# Guildmark's shader pack: dark fantasy. Muted colour, deep shadows, heavy mist and strong shafts of light.
# Made for Iris 1.11 on Minecraft 26.3 (OpenGL). See lib/settings.glsl for what each setting does.

# ---- Settings screen
screen=<profile> <empty> [LIGHT] [SHADOWS] [ATMOSPHERE] [WATER] [CAMERA] [MOTION]
screen.columns=2
screen.LIGHT=SUN_STRENGTH AMBIENT_STRENGTH NIGHT_BRIGHTNESS CAVE_DARKNESS TORCH_STRENGTH TORCH_FLICKER HELD_LIGHT EMISSIVE_STRENGTH SSAO SSAO_STRENGTH FOLIAGE_SSS
screen.LIGHT.columns=2
screen.SHADOWS=shadowMapResolution shadowDistance SHADOW_FILTER SHADOW_SOFTNESS COLORED_SHADOWS CLOUD_SHADOWS sunPathRotation
screen.SHADOWS.columns=2
screen.ATMOSPHERE=MIST_DENSITY VALLEY_MIST LIGHT_SHAFTS SHAFT_STRENGTH SHAFT_STEPS SUN_RAYS CLOUDS CLOUD_COVERAGE CLOUD_HEIGHT STARS RAIN_WETNESS
screen.ATMOSPHERE.columns=2
screen.WATER=WATER_WAVES WATER_MURK WATER_REFLECTIONS
screen.WATER.columns=2
screen.CAMERA=EXPOSURE AUTO_EXPOSURE BLOOM BLOOM_STRENGTH SATURATION GREEN_MUTE CONTRAST SPLIT_TONE VIGNETTE FILM_GRAIN FXAA
screen.CAMERA.columns=2
screen.MOTION=WAVING_PLANTS WAVING_LEAVES WIND_STRENGTH
screen.MOTION.columns=2

sliders=shadowMapResolution shadowDistance sunPathRotation SHADOW_FILTER SHADOW_SOFTNESS SUN_STRENGTH AMBIENT_STRENGTH \
 NIGHT_BRIGHTNESS CAVE_DARKNESS TORCH_STRENGTH EMISSIVE_STRENGTH SSAO_STRENGTH MIST_DENSITY VALLEY_MIST SHAFT_STRENGTH \
 SHAFT_STEPS CLOUD_COVERAGE CLOUD_HEIGHT WATER_WAVES WATER_MURK EXPOSURE BLOOM_STRENGTH SATURATION GREEN_MUTE CONTRAST \
 SPLIT_TONE VIGNETTE FILM_GRAIN WIND_STRENGTH

profile.LOW=shadowMapResolution:1024 shadowDistance:96.0 SHADOW_FILTER:1 !SSAO SHAFT_STEPS:8 !CLOUD_SHADOWS !WATER_REFLECTIONS
profile.MEDIUM=shadowMapResolution:2048 shadowDistance:128.0 SHADOW_FILTER:2 SSAO SHAFT_STEPS:8 CLOUD_SHADOWS WATER_REFLECTIONS
profile.HIGH=shadowMapResolution:2048 shadowDistance:128.0 SHADOW_FILTER:2 SSAO SHAFT_STEPS:12 CLOUD_SHADOWS WATER_REFLECTIONS
profile.ULTRA=shadowMapResolution:4096 shadowDistance:192.0 SHADOW_FILTER:3 SSAO SHAFT_STEPS:16 CLOUD_SHADOWS WATER_REFLECTIONS

# ---- What Minecraft still draws itself
sun=false
moon=false
vignette=false
underwaterOverlay=false
oldLighting=false
clouds=off

# ---- Passes
# Particles are lit as they're drawn, after deferred
particles.ordering=after
# Light shafts and bloom are worked out at half size
scale.composite1=0.5
scale.composite3=0.5
# Distant Horizons' far land stays past the shadow map anyway
dhShadow.enabled=false

# ---- Blending
blend.gbuffers_terrain=off
blend.gbuffers_block=off
blend.gbuffers_hand=off
blend.gbuffers_spidereyes=off
blend.gbuffers_beaconbeam=off
blend.gbuffers_lightning=off
blend.gbuffers_damagedblock=DST_COLOR SRC_COLOR ZERO ONE
blend.gbuffers_armor_glint=ONE ONE ZERO ONE
blend.gbuffers_water=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_hand_water=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.dh_water=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
