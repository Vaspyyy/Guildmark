org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin stdlib is bundled explicitly via jarJar in build.gradle
kotlin.stdlib.default.dependency=false

## Environment
# Latest versions: https://projects.neoforged.net/neoforged/neoforge
minecraft_version=26.3
minecraft_version_range=[26.3]
neo_version=26.3.0.52-beta
kotlin_version=2.4.0

## Companion mods in the dev runs (see build.gradle); with_tectonic=false or with_distant_horizons=false leaves them out
with_tectonic=true
tectonic_version=3.0.31-neoforge-26.3
lithostitched_version=2.0.4-neoforge-26.3
with_distant_horizons=true
distant_horizons_version=3.3.4-26.3
## SeedGen by Modrinth version id (0.9.1 for NeoForge 26.3): its version numbers repeat across loaders
with_seedgen=false
seedgen_version=Jt85EL7Y

## Mod
mod_id=guildmark
mod_name=Guildmark
mod_license=All Rights Reserved
mod_version=0.1.0
mod_group_id=io.github.vaspyyy.guildmark
